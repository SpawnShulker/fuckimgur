<!DOCTYPE html>
<html>
<head>
    <title>FuckImgur</title>
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #mainImg {
            width: 300px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s;
        }
        
        #mainImg:hover {
            transform: scale(1.05);
        }
        
        .copied-img {
            position: absolute;
            width: 150px;
            cursor: pointer;
            border-radius: 10px;
            animation: float 3s infinite alternate;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <img src="fuckimgur.png" id="mainImg" onclick="copyImage()">

    <script>
        function copyImage() {
            const mainImg = document.getElementById('mainImg');

            for (let i = 0; i < 8; i++) {
                const imgCopy = document.createElement('img');
                imgCopy.src = mainImg.src;
                imgCopy.className = 'copied-img';

                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 150);
                imgCopy.style.left = x + 'px';
                imgCopy.style.top = y + 'px';
              
                const size = 100 + Math.random() * 100;
                imgCopy.style.width = size + 'px';

                const rotation = Math.random() * 360;
                imgCopy.style.transform = `rotate(${rotation}deg)`;

                imgCopy.onclick = copyImage;
                
                document.body.appendChild(imgCopy);
            }

            const currentSize = parseInt(mainImg.style.width) || 300;
            mainImg.style.width = (currentSize + 20) + 'px';
        }

        document.getElementById('mainImg').onerror = function() {
            this.src = 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
        };
    </script>
</body>
</html>
